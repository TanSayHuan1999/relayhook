name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhook
          POSTGRES_PASSWORD: relayhook
          POSTGRES_DB: relayhook
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U relayhook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://relayhook:relayhook@localhost:5432/relayhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test ./... -count=1
